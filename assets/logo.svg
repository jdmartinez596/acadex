<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo premium (Azul oscuro a Verde esmeralda) -->
    <linearGradient id="acadex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="50%" stop-color="#152B47" />
      <stop offset="100%" stop-color="#2ECC71" />
    </linearGradient>
    
    <!-- Sombra suave para darle volumen -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fondo redondeado con gradiente -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#acadex-grad)" filter="url(#drop-shadow)" />

  <!-- Elemento principal: Birrete de graduación modernizado -->
  <g transform="translate(18, 22)">
    <!-- Parte superior del birrete (rombo/diamante) -->
    <polygon points="32,0 64,16 32,32 0,16" fill="#FFFFFF" />
    
    <!-- Parte inferior / copa del birrete -->
    <path d="M12,22 C12,32 52,32 52,22 L52,16 L32,26 L12,16 Z" fill="#E8ECEF" />
    
    <!-- Borla / Tassel colgante -->
    <path d="M48,24 L48,34 C48,38 46,40 44,40 C42,40 42,37 42,34 L42,24 Z" fill="#2ECC71" />
    <circle cx="48" cy="23" r="2" fill="#2ECC71" />
  </g>

  <!-- Detalle decorativo: Libro abierto abajo o laureles -->
  <path d="M35,68 C42,65 48,68 50,70 C52,68 58,65 65,68 L65,76 C58,73 52,75 50,78 C48,75 42,73 35,76 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Pequeño punto brillante de excelencia -->
  <circle cx="75" cy="25" r="3" fill="#2ECC71" />
</svg>
